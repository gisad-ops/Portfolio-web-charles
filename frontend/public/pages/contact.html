<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont/tabler-icons.min.css">
    <link rel="stylesheet" href="../../styles/Home.css">
    <title>Charles Aivan Dasig | Contact</title>
</head>

<body>

    <nav class="floating-nav">
        <div class="nav-links">
            <a href="../index.html">Home</a>
            <a href="about.html">About</a>
            <a href="skills.html">Skills</a><a href="certificates.html">Certifications</a>
            <a href="projects.html">Projects</a>
            <a href="services.html">Services</a>
            <a href="social.html">Social</a>
            <button class="theme-toggle-btn" onclick="darkBtn()">
                <i class="ti ti-moon"></i>
            </button>
        </div>
        <div class="nav-divider"></div>
        <a href="contact.html" class="nav-contact-btn active">
            Contact
            <i class="ti ti-arrow-right"></i>
        </a>
    </nav>

    <main class="bento-container" style="padding-top: 10rem;">
        <div style="max-width: 600px; margin: 0 auto; text-align: center;">
            <div class="bento-cell glass simple-shadow" style="padding: 3rem; border-radius: var(--border-radius);">
                <h1 class="hero-heading" style="margin-bottom: 1rem;">Let's Connect</h1>
                <p class="hero-description" style="margin-bottom: 2rem;">
                    I'd love to hear from you! Whether you have a project in mind or just want to chat about web development, feel free to reach out.
                </p>
                
                <form id="contact-form" style="display: flex; flex-direction: column; gap: 1rem; align-items: center; width:100%;">
                    <div style="width: 100%;">
                        <input id="name" name="name" type="text" autocomplete="name" maxlength="100" placeholder="Your Name" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--glass-border); border-radius: 9999px; background: var(--glass-bg); color: var(--text-color); font-family: var(--font-body);">
                    </div>
                    <div style="width: 100%;">
                        <input id="email" name="email" type="email" autocomplete="email" maxlength="254" placeholder="Your Email" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--glass-border); border-radius: 9999px; background: var(--glass-bg); color: var(--text-color); font-family: var(--font-body);">
                    </div>
                    <div style="width: 100%;">
                        <textarea id="message" name="message" maxlength="5000" placeholder="Your Message" rows="5" required style="width: 100%; padding: 0.75rem 1rem; border: 1px solid var(--glass-border); border-radius: 16px; background: var(--glass-bg); color: var(--text-color); font-family: var(--font-body); resize: none;"></textarea>
                    </div>
                    <button class="btn-primary" type="submit" style="margin-top: 1rem; padding: 0.75rem 2rem; background-color: var(--accent-color); color: white; border: none; border-radius: 9999px; cursor: pointer; font-weight: 700; transition: all 0.3s ease;">
                        Send Message
                        <i class="ti ti-send" style="margin-left: 0.5rem;"></i>
                    </button>
                    <p id="form-status" role="status" aria-live="polite" style="color:var(--text-muted);font-size:.9rem"></p>
                </form>

                <div style="margin-top: 2rem; padding-top: 2rem; border-top: 1px solid var(--glass-border);">
                    <p style="color: var(--text-muted); margin-bottom: 1rem;">Or reach me directly:</p>
                    <div style="display: flex; gap: 1rem; justify-content: center;">
                        <a href="mailto:YOUR_EMAIL_HERE" style="padding: 0.5rem 1rem; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 9999px; color: var(--text-color); text-decoration: none; transition: all 0.3s ease;">
                            <i class="ti ti-mail"></i> Email
                        </a>
                        <a href="https://linkedin.com" target="_blank" style="padding: 0.5rem 1rem; background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 9999px; color: var(--text-color); text-decoration: none; transition: all 0.3s ease;">
                            <i class="ti ti-brand-linkedin"></i> LinkedIn
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="../../src/theme.js"></script>
    <script src="../../src/contact.js"></script>
</body>

</html>
